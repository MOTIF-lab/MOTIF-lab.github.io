<header class="site-header">
  <div class="container nav-row">
    <a class="brand" href="{{ "/" | relURL }}">
      <span class="brand-mark">MOTIF</span>
      <span class="brand-sub">Lab · USF</span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation">
    <label for="nav-toggle" class="nav-toggle-label" aria-hidden="true">
      <span></span><span></span><span></span>
    </label>
    <nav class="site-nav" aria-label="Primary">
      <ul>
        {{ range .Site.Menus.main }}
        <li><a href="{{ .URL | relURL }}"{{ if $.IsMenuCurrent "main" . }} class="active"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>
