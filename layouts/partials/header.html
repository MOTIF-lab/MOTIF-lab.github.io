<header class="site-header">
  <div class="container nav-row">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="MOTIF Lab — University of South Florida — home">
      <img class="brand-logo"
           src="{{ "img/logo/USF-motif-lab-1c-white-rgb-h.png" | relURL }}"
           alt="USF MOTIF Lab">
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation">
    <label for="nav-toggle" class="nav-toggle-label" aria-hidden="true">
      <span></span><span></span><span></span>
    </label>
    <nav class="site-nav" aria-label="Primary">
      <ul>
        {{ range .Site.Menus.main }}
        <li><a href="{{ .URL | relURL }}"{{ if $.IsMenuCurrent "main" . }} class="active"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>
